# 44 cases. The first eight match the required test_results.md questions.
- id: q1-cost
  category: required
  question: How much does adenocarcinoma cancer treatment cost in Mexico?
  expect:
    intent: price
    grounded: true
    must_contain: ["18,995", "30,000", "start", "week"]
    must_not_contain: ["$50"]
    must_cite: ["package/7903"]
- id: q2-ozone
  category: required
  question: Is ozone therapy cheaper in Turkey or Mexico?
  expect:
    intent: comparison
    grounded: true
    must_contain: ["110", "1000", "Fizikon", "Turkey", "Mexico"]
    must_not_contain: ["exact price"]
    must_cite: ["search-medical-pricings"]
- id: q2b-thailand
  category: required
  question: Is adenocarcinoma treatment cheaper in Mexico or Thailand?
  expect:
    intent: comparison
    grounded: true
    must_contain: ["Thailand"]
    must_not_contain: ["Thailand is cheaper"]
    must_cite: ["package/7903"]
- id: q3-included
  category: required
  question: What is included in the adenocarcinoma treatment package?
  expect:
    intent: info
    grounded: true
    must_contain: ["lab", "meal"]
    must_not_contain: []
    must_cite: ["package/7903"]
- id: q4-recovery
  category: required
  question: And what about recovery time?
  history:
    - role: user
      content: What is included in the adenocarcinoma treatment package?
    - role: assistant
      content: The adenocarcinoma package includes lab work, meals, and a follow-up consultation after 3 months.
  expect:
    intent: info
    grounded: true
    must_contain: ["not listed", "week", "month"]
    must_not_contain: ["recovery time is 2 weeks", "recovery takes"]
    must_cite: ["package/7903"]

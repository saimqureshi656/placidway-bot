# Grounding gaps found in manual testing.
- id: appendix-price
  category: grounding
  question: How much is the appendix cancer package?
  expect:
    intent: price
    grounded: true
    must_contain: ["appendix", "listed"]
    must_not_contain: ["18,995", "30,000", "Out-Patient", "In-Patient"]
    must_cite: []
- id: liver-price
  category: grounding
  question: Does ITC treat liver cancer and how much?
  expect:
    intent: price
    grounded: true
    must_contain: ["liver", "18,995"]
    must_not_contain: ["Out-Patient", "In-Patient", "outpatient", "inpatient", "30,000"]
    must_cite: ["profile/5"]
- id: prostate-price
